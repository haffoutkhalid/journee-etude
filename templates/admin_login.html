<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — فضاء الإدارة</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-body">
    <section class="admin-login">
        <div class="admin-login__card">
            <p class="admin-login__subtitle">أدخل كلمة السر للاطلاع على لائحة الحضور</p>

            <form method="POST" class="reg-form">
                <div class="reg-form__row">
                    <label for="password">كلمة السر</label>
                    <input type="password" id="password" name="password" required autofocus>
                </div>

                {% if error %}
                <p class="reg-form__error">{{ error }}</p>
                {% endif %}

                <button type="submit" class="btn btn--gold btn--full">دخول</button>
            </form>

            <a href="{{ url_for('index') }}" class="admin-login__back" style="display:block; text-align:center; margin-top:15px; color:#666;">العودة للصفحة الرئيسية</a>
        </div>
    </section>
</body>
</html>
